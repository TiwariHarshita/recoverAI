[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverai-backend"
version = "0.1.0"
description = "RecoverAI revenue recovery backend and simulator"
readme = { text = "RecoverAI backend and synthetic recovery simulator.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "scikit-learn>=1.5,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[project.scripts]
recoverai-init-db = "app.db.init_db:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "experiments*", "simulator*"]
exclude = ["recoverai_layers17_20_delta*"]

[tool.pytest.ini_options]
addopts = "-ra"
python_files = ["test_*.py"]
pythonpath = ["."]
testpaths = ["tests", "test_recovery_pipeline.py"]
